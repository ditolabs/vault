name: Release APK

# Triggered by pushing a version tag, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create a Release and upload the APK to it
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Still the debug-signed build (debug keystore, auto-generated by Gradle).
      # Fine to install/sideload and share with people you trust; NOT the same
      # as a Play Store release signature — see README "Soal signing" section.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk PwVault-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PwVault-${{ github.ref_name }}.apk
          generate_release_notes: true
          name: PwVault ${{ github.ref_name }}
          body: |
            APK debug-signed (bukan release-signed) — aman diinstall sendiri atau dibagi ke orang yang dipercaya.
            Enable "install dari sumber tidak dikenal" di HP sebelum install.
