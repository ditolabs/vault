name: Release APK

# Manual step required: after merging, tag the release commit and push the
# tag — this workflow does not create tags itself.
#   git tag v0.3.2
#   git push origin v0.3.2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version tag
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk "release-out/PwVault-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.apk
          generate_release_notes: true
          body: |
            APK debug-signed (bukan release-signed) — aman diinstall sendiri atau dibagi ke orang yang dipercaya.
            Enable "install dari sumber tidak dikenal" di HP sebelum install.
